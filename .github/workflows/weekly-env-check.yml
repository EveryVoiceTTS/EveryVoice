name: Weekly make-everyvoice-env check

# test.yml and matrix-tests.yml install with `uv sync --locked`, so nothing in CI
# exercises the path make-everyvoice-env actually uses: `uv pip install -e .[dev]`,
# a fresh resolution with no lockfile. This job builds the environment through the
# script and runs pytest, so we notice when uv.lock and a fresh resolve drift
# apart before a contributor does.

on:
  schedule:
    # 07:00 UTC every Monday
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  make-everyvoice-env:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    env:
      # Fix a bug in the ffmpeg installation via awalsh128/cache-apt-pkgs-action
      LD_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu/lapack:/usr/lib/x86_64-linux-gnu/blas
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: awalsh128/cache-apt-pkgs-action@681749ae568c81c2037cb9185e38b709b261bd2f # v1.6.1
        with:
          packages: sox ffmpeg
      - name: Verify SoX installation
        run: sox --version
      - name: Verify ffmpeg installation
        run: ffmpeg -version
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.21"
      - name: Build the environment with make-everyvoice-env (no lockfile)
        run: printf 'y\n' | ./make-everyvoice-env --uv --cpu --python 3.12
      - name: Put the new environment on PATH
        # The test suite shells out to the `everyvoice` console script, so its
        # bin dir has to be on PATH the way `source .venv/bin/activate` would put it.
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Show the resolved environment
        run: uv pip freeze --python ./.venv/bin/python
      - name: Run the test suite
        run: pytest
      - name: Check for logs_and_checkpoints/ and preprocessed/
        run: |
          find -type d -name logs_and_checkpoints -or -name preprocessed | grep -v 'tests/data' || true
          [[ $(find -type d -name logs_and_checkpoints -or -name preprocessed | grep --count --invert-match 'tests/data') -eq 0 ]]
      - name: File an issue if the weekly check failed
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Weekly make-everyvoice-env check failed"
          open_count=$(gh issue list --state open --search "in:title $title" --json number --jq 'length')
          if [ "$open_count" -gt 0 ]; then
            echo "An issue for this failure is already open; not filing another."
            exit 0
          fi
          gh issue create \
            --title "$title" \
            --assignee joanise \
            --body "The scheduled [make-everyvoice-env check](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) failed.

          \`make-everyvoice-env\` resolves dependencies without \`uv.lock\`, so a failure here usually means \`uv.lock\` and a fresh resolution have drifted apart, or a new transitive release broke something. Reconcile them (e.g. \`uv lock\`) and confirm the suite passes both ways."
